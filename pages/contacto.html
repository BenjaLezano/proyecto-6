<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto y Booking | TrapZone</title>
  <meta name="description" content="Ponte en contacto con el equipo de TrapZone para contrataciones, fechas o prensa.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-trapzone" aria-label="Navegación principal">
      <div class="container">
        <a class="navbar-brand logotipo" href="../index.html">TrapZone</a>
        <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav gap-2">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="./sobre-mi.html">Artistas</a></li>
            <li class="nav-item"><a class="nav-link" href="./proyectos.html">Lanzamientos</a></li>
            <li class="nav-item"><a class="nav-link" href="./servicios.html">Producción</a></li>
            <li class="nav-item"><a class="nav-link active" href="./contacto.html" aria-current="page">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container contenedor-principal">
    <section class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <h1 class="titulo-principal">Formulario de Contacto</h1>
        <p class="text-secondary mb-4">Envía tu propuesta o consulta al equipo de TrapZone.</p>

        <form action="#" method="POST">
          <div class="mb-3">
            <label for="nombre" class="form-label text-light">Nombre completo</label>
            <input type="text" id="nombre" class="form-control campo-texto" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label text-light">Correo electrónico</label>
            <input type="email" id="email" class="form-control campo-texto" required>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label text-light">Mensaje</label>
            <textarea id="mensaje" rows="4" class="form-control area-texto" required></textarea>
          </div>
          <button type="submit" class="boton-primario w-100">Enviar Consulta</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="pie-pagina">
    <p class="m-0 text-secondary">&copy; 2026 TrapZone Web. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
